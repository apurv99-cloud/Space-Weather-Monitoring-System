version: '3.8'

services:

  postgres:
    image: postgres:16
    container_name: postgres-db

    environment:
      POSTGRES_DB: spaceweather
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spaceweather"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - space-weather-network


  backend:
    build:
      context: ./demo
      dockerfile: Dockerfile

    container_name: springboot-backend

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/spaceweather
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - space-weather-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: react-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - space-weather-network


volumes:
  postgres-data:


networks:
  space-weather-network: